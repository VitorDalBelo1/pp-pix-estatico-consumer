quarkus.application.name=pp-pix-estatico-consumer
# 8080 fica com a API mock; o consumidor sobe em outra porta
quarkus.http.port=${PORT:8080} 

# ---------------------------------------------------------------------------
# Kafka - canal de entrada
# ---------------------------------------------------------------------------
# Em dev/test a propriedade fica em branco de proposito: assim o Quarkus sobe um
# broker automaticamente (Dev Services). Se voce ja tem um Kafka local, defina
# kafka.bootstrap.servers=localhost:9092 aqui e desligue os Dev Services abaixo.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

mp.messaging.incoming.pagamentos-pix-estatico.connector=smallrye-kafka
mp.messaging.incoming.pagamentos-pix-estatico.topic=pagamentos.pix-estatico
mp.messaging.incoming.pagamentos-pix-estatico.group.id=pp-informe-preliminar-pix-estatico
mp.messaging.incoming.pagamentos-pix-estatico.value.deserializer=br.gov.pp.consumer.kafka.PagamentoPixEstaticoDeserializer
mp.messaging.incoming.pagamentos-pix-estatico.auto.offset.reset=earliest
mp.messaging.incoming.pagamentos-pix-estatico.enable.auto.commit=false

# Consumo em lote: cada invocacao do @Incoming recebe todos os registros do poll
mp.messaging.incoming.pagamentos-pix-estatico.batch=true
mp.messaging.incoming.pagamentos-pix-estatico.max.poll.records=500
mp.messaging.incoming.pagamentos-pix-estatico.max.poll.interval.ms=300000

# Se o processamento falhar (depois dos retries), o registro vai para a DLQ.
# Alternativas: "fail" (para o canal) ou "ignore" (descarta e segue).
mp.messaging.incoming.pagamentos-pix-estatico.failure-strategy=dead-letter-queue
mp.messaging.incoming.pagamentos-pix-estatico.dead-letter-queue.topic=pagamentos.pix-estatico.DLQ

# ---------------------------------------------------------------------------
# REST client - Plataforma Publica de Split Payment
# ---------------------------------------------------------------------------
quarkus.rest-client.pp-split-payment.url=http://localhost:8081
quarkus.rest-client.pp-split-payment.scope=jakarta.inject.Singleton
quarkus.rest-client.pp-split-payment.connect-timeout=5000
quarkus.rest-client.pp-split-payment.read-timeout=15000

# Assinatura JWS ficticia (o mock nao valida). Em producao, gerar por requisicao.
pp.jws-signature=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXUyJ9..assinatura-ficticia

# Maximo de transacoes por requisicao (limite do contrato)
informe.max-transacoes-por-requisicao=1000

quarkus.log.level=INFO
quarkus.log.category."br.gov.pp.consumer".level=DEBUG

# ---------------------------------------------------------------------------
# Dev: sem broker configurado, o Quarkus sobe um Kafka via Dev Services
# ---------------------------------------------------------------------------
%dev.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true
